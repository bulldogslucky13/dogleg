<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#12251a" />
    <meta name="description" content="DogLeg — a daily golf challenge. One course, 18 holes, every decision shifts the odds." />
    <!-- Pinterest site claim (playdogleg.com). Not a secret — the tag IS the
         claim. Also emitted on every generated marketing page (scripts/lib/
         pages.tsx); keep the two values in step. -->
    <meta name="p:domain_verify" content="1a5c4413c8c5dfc3cbee237c0da375ee" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DogLeg" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="canonical" href="https://playdogleg.com/" />

    <!-- Icons: the dl mark (d's flagstick + l's dogleg into the cup), SVG for the tab, PNGs for home-screen / rich previews -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (iMessage, Slack, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DogLeg" />
    <meta property="og:title" content="DogLeg — daily golf challenge" />
    <meta property="og:description" content="One course. 18 holes. Play the odds and beat the course. A new daily golf challenge." />
    <meta property="og:url" content="https://playdogleg.com/" />
    <!-- The card is GENERATED from the real logo + theme tokens: `pnpm gen:og-image`
         (scripts/gen-og-image.ts). Never hand-edit public/og.png — a hand-made one
         is how this surface sat on retired branding for a week after the rebrand.
         ?v= is a cache-bust: iMessage, Slack and Facebook key their preview cache on
         the image URL, so a redrawn card at the same URL keeps serving the old
         picture. Bump it whenever the card changes. -->
    <meta property="og:image" content="https://playdogleg.com/og.png?v=3" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DogLeg — the wordmark in cream on deep turf green, a red pennant flying from the d's stem and the l doglegging down into the cup. Daily Golf Challenge · 18 Holes. Play the Odds." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DogLeg — daily golf challenge" />
    <meta name="twitter:description" content="One course. 18 holes. Play the odds and beat the course. A new daily golf challenge." />
    <meta name="twitter:image" content="https://playdogleg.com/og.png?v=3" />
    <meta name="twitter:image:alt" content="DogLeg — the wordmark in cream on deep turf green, a red pennant flying from the d's stem and the l doglegging down into the cup." />

    <!-- Structured data for search: the site and the game itself. The course
         guides carry their own BreadcrumbList (generated per page). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DogLeg",
        "url": "https://playdogleg.com/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "DogLeg",
        "url": "https://playdogleg.com/",
        "description": "A free daily golf strategy game: one course, 18 holes, every decision shifts the odds. Beat the course and break par.",
        "genre": ["Sports game", "Strategy game", "Daily puzzle"],
        "playMode": "SinglePlayer",
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <title>DogLeg — daily golf challenge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
